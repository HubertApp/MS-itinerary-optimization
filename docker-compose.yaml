services:

  itinerary-optimization:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-itinerary-optimization
    labels:
      logging: "promtail"
      service: "itinerary-optimization"
    ports:
      - "3010:3010"
    environment:
      PORT: 3010
      LOG_LEVEL: INFO

      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-optimization_db}

      TRAFFIC_SOURCE: ${TRAFFIC_SOURCE:-synthetic}
      MODEL_PATH: ${MODEL_PATH:-friction.joblib}
    # RABBITMQ_URL et TOMTOM_API_KEY portent des secrets : ils viennent du
    # .env local, jamais d'une valeur en dur versionnee. Voir .env.example.
    env_file:
      - path: .env
        required: false
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - hubert-network
      - itinerary-optimization-network

  mongo:
    image: mongo:7
    container_name: ms-itinerary-optimization-mongo
    # Publie sur l'hote pour lancer le backfill hors conteneur pendant le
    # developpement, mais sur la loopback uniquement : cette instance n'a pas
    # d'authentification, la lier a 0.0.0.0 l'ouvrirait a tout le reseau local.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - itinerary-optimization-network

volumes:
  mongo-data:

networks:
  hubert-network:
    external: true

  itinerary-optimization-network:
    driver: bridge
